name: deploy-prod-tag

# Promotion is manual and requires successful CI and a 100%-serving,
# healthy staging revision carrying the same commit and immutable digest.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Commit or tag already verified on staging"
        required: true
      note:
        description: "Why this production promotion is needed"
        required: true

concurrency:
  group: farm-backend-production
  cancel-in-progress: false
permissions:
  contents: read
  actions: read
  id-token: write
jobs:
  deploy-prod:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/451400509859/locations/global/workloadIdentityPools/github/providers/github
          service_account: 451400509859-compute@developer.gserviceaccount.com
          project_id: seges-ai
      - uses: google-github-actions/setup-gcloud@v3
      - name: Verify and promote tested staging image
        shell: bash
        env:
          INPUT_REF: ${{ inputs.ref }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          SHA="$(git rev-parse --verify "${INPUT_REF}^{commit}")"
          git merge-base --is-ancestor "$SHA" origin/main
          gcloud run services describe farm-seges-ai-staging --project=seges-ai --region=asia-east1 --format=json > "$RUNNER_TEMP/staging.json"
          REV="$(python -c 'import json,sys; t=json.load(open(sys.argv[1]))["status"]["traffic"]; s=[x for x in t if x.get("percent",0)>0]; assert len(s)==1 and s[0]["percent"]==100; print(s[0]["revisionName"])' "$RUNNER_TEMP/staging.json")"
          gcloud run revisions describe "$REV" --project=seges-ai --region=asia-east1 --format=json > "$RUNNER_TEMP/revision.json"
          gcloud run services describe farm-seges-ai --project=seges-ai --region=asia-east1 --format=json > "$RUNNER_TEMP/prod.json"
          # `status` filters workflow runs by lifecycle state (queued,
          # in_progress, completed); success is a conclusion. Fetch completed
          # candidates and let verify-promotion.py require conclusion=success.
          gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/test.yml/runs?head_sha=${SHA}&event=push&status=completed&per_page=100" > "$RUNNER_TEMP/runs.json"
          IMAGE="$(python deploy/verify-promotion.py --service "$RUNNER_TEMP/staging.json" --revision "$RUNNER_TEMP/revision.json" --production "$RUNNER_TEMP/prod.json" --runs "$RUNNER_TEMP/runs.json" --sha "$SHA")"
          curl --fail --silent --show-error --max-time 15 https://farm-seges-ai-staging-451400509859.asia-east1.run.app/livez > /dev/null
          PREVIOUS="$(python -c 'import json,sys; t=json.load(open(sys.argv[1]))["status"]["traffic"]; s=[x for x in t if x.get("percent",0)>0]; assert len(s)==1 and s[0]["percent"]==100; print(s[0]["revisionName"])' "$RUNNER_TEMP/prod.json")"
          # No env or secret replacement: preserve the verified service config.
          gcloud run deploy farm-seges-ai --project=seges-ai --region=asia-east1 --image "$IMAGE" --no-traffic
          CANDIDATE="$(gcloud run services describe farm-seges-ai --project=seges-ai --region=asia-east1 --format='value(status.latestCreatedRevisionName)')"
          test -n "$CANDIDATE" && test "$CANDIDATE" != "$PREVIOUS"
          CANDIDATE_IMAGE="$(gcloud run revisions describe "$CANDIDATE" --project=seges-ai --region=asia-east1 --format='value(status.imageDigest)')"
          test "$CANDIDATE_IMAGE" = "$IMAGE"
          rollback() { gcloud run services update-traffic farm-seges-ai --project=seges-ai --region=asia-east1 --to-revisions "${PREVIOUS}=100"; }
          trap rollback ERR
          gcloud run services update-traffic farm-seges-ai --project=seges-ai --region=asia-east1 --to-revisions "${CANDIDATE}=100"
          ACTUAL="$(gcloud run services describe farm-seges-ai --project=seges-ai --region=asia-east1 --format='value(status.traffic[0].revisionName,status.traffic[0].percent)')"
          test "$ACTUAL" = "${CANDIDATE}	100"
          curl --fail --silent --show-error --retry 5 --retry-delay 3 --max-time 15 https://farm-seges-ai-451400509859.asia-east1.run.app/livez > /dev/null
          curl --fail --silent --show-error --retry 5 --retry-delay 3 --max-time 25 https://farm-seges-ai-451400509859.asia-east1.run.app/farm/weather > "$RUNNER_TEMP/weather.json"
          python deploy/verify_weather_smoke.py "$RUNNER_TEMP/weather.json"
          trap - ERR
          echo "Promoted $SHA as $IMAGE, serving revision $CANDIDATE"
