name: web-image

# CI for the FIELD WEB APP image (farm-seges-ai-web). Mirrors the auth shape
# proven in test.yml / deploy-prod-tag.yml (workload-identity federation,
# pool/provider provisioned once per project in deploy/GCP_SETUP.md — no
# repository secrets involved).
#
# Pipeline shape:
#   push to main touching web/** or Dockerfile.web or this file
#     → build image via Cloud Build (web/tools/web-image-build.ps1)
#     → deploy to the LIVE farm-seges-ai-web service (the report is the
#       user-facing product; staging parity added later in WS-ops review)
#     → pin traffic --to-latest + smoke the live URL (livez/gate/thumb).
#   workflow_dispatch WITHOUT image_ref: same as above, manually.
#   workflow_dispatch WITH image_ref (digest or tag): PIN job only —
#     rolls the service back to that exact image (explicit digest per
#     ops discipline; see deploy/web-rollback.md).

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "Dockerfile.web"
      - ".github/workflows/web-image.yml"
  workflow_dispatch:
    inputs:
      image_ref:
        description: "PIN ONLY: exact image ref (digest preferred) to roll back / pin to. Leave EMPTY to build+deploy from the ref."
        required: false
        default: ""

# Serialise everything through one group: two overlapping merges must not
# race two deploys onto the same Cloud Run service.
concurrency:
  group: web-image-production
  cancel-in-progress: false

permissions:
  contents: read

env:
  IMAGE_BASE: asia-east1-docker.pkg.dev/seges-ai/cloud-run-source-deploy/farm-seges-ai-web

jobs:
  build-push:
    # On pushes, or on a manual dispatch that did NOT request a pin.
    if: ${{ inputs.image_ref == '' || inputs.image_ref == null }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    outputs:
      image_tag: ${{ steps.img.outputs.image_tag }}
      image_digest: ${{ steps.img.outputs.image_digest }}
    steps:
      - uses: actions/checkout@v4
      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/451400509859/locations/global/workloadIdentityPools/github/providers/github
          service_account: 451400509859-compute@developer.gserviceaccount.com
          project_id: seges-ai
      - uses: google-github-actions/setup-gcloud@v2
      - name: Build and push image via Cloud Build
        run: |
          TAG="ci-$(git rev-parse --short HEAD)"
          pwsh -NoProfile -File web/tools/web-image-build.ps1 -TagSuffix "$TAG"
          echo "image_tag=$TAG" >> "$GITHUB_OUTPUT"
        id: build
        shell: bash
      - name: Resolve the pushed digest (the rollback anchor)
        id: img
        run: |
          TAG="ci-$(git rev-parse --short HEAD)"
          DIGEST="$(gcloud artifacts docker images describe "$IMAGE_BASE:$TAG" \
            --project seges-ai --format='value(digest)')"
          echo "image_tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "image_digest=$DIGEST" >> "$GITHUB_OUTPUT"
          echo "::notice::Image $IMAGE_BASE@$DIGEST (tag $TAG)"

  deploy-web:
    needs: build-push
    # Live deploys only from an actual main push or an explicit manual run.
    if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/451400509859/locations/global/workloadIdentityPools/github/providers/github
          service_account: 451400509859-compute@developer.gserviceaccount.com
          project_id: seges-ai
      - uses: google-github-actions/setup-gcloud@v2
      - name: Deploy farm-seges-ai-web (complete env/secrets set — these flags REPLACE, never merge)
        run: |
          gcloud run deploy farm-seges-ai-web \
            --project=seges-ai --region=asia-east1 \
            --image "$IMAGE_BASE:${{ needs.build-push.outputs.image_tag }}" \
            --allow-unauthenticated \
            --set-secrets "WEB_ACCESS_TOKEN=web-access-token:latest,PLANET_API_KEY=Planet-labs:latest" \
            --set-env-vars "FARM_API_BASE=https://farm-seges-ai-451400509859.asia-east1.run.app,FARM_RECORD_BACKEND=gcs,FARM_RECORD_BUCKET=farm-seges-ai-records,FARM_RECORD_DIR=/tmp/field-notes" \
            --memory 512Mi --cpu 1 --max-instances 2 --timeout 60
      - name: Pin traffic to the latest revision (the WS1 traffic-shift gotcha)
        run: |
          gcloud run services update-traffic farm-seges-ai-web \
            --project=seges-ai --region=asia-east1 --to-latest
          gcloud run services describe farm-seges-ai-web \
            --project=seges-ai --region=asia-east1 \
            --format='value(status.traffic[0].revisionName,status.latestCreatedRevisionName)'
      - name: Smoke the live service (livez 200, gate 307, thumb image)
        run: |
          BASE="https://farm-seges-ai-web-451400509859.asia-east1.run.app"
          ok() { [ "$1" = "$2" ] && echo "PASS $3 ($1)" || { echo "FAIL $3: got '$1' want '$2'"; exit 1; }; }
          tries=0; livez=""
          until [ "$livez" = "200" ] || [ $tries -ge 12 ]; do sleep 5; tries=$((tries+1)); livez=$(curl -s -o /dev/null -w '%{http_code}' "$BASE/livez"); done
          ok "$livez" "200" "/livez"
          ok "$(curl -s -o /dev/null -w '%{http_code}' "$BASE/")" "307" "gate (GET /)"
          gate_loc="$(curl -s -o /dev/null -w '%{redirect_url}' "$BASE/")"
          case "$gate_loc" in *"/login?next="%2F*) echo "PASS gate location ($gate_loc)";; *) echo "FAIL gate location: $gate_loc"; exit 1;; esac
          ctype="$(curl -s -o /dev/null -w '%{content_type}' "$BASE/api/scene-thumb")"
          case "$ctype" in image/png*) echo "PASS scene-thumb ($ctype)";; *) echo "FAIL scene-thumb: $ctype"; exit 1;; esac
          ok "$(curl -s -o /dev/null -w '%{http_code}' "$BASE/report/biratori-1119")" "200" "report"
          echo "::notice::Web deploy smoke GREEN at $BASE (image $IMAGE_BASE@${{ needs.build-push.outputs.image_digest }})"

  pin-rollback:
    # Dispatch-only: pin the live service to an EXPLICIT older image ref.
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.image_ref != '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/451400509859/locations/global/workloadIdentityPools/github/providers/github
          service_account: 451400509859-compute@developer.gserviceaccount.com
          project_id: seges-ai
      - uses: google-github-actions/setup-gcloud@v2
      - name: Pin farm-seges-ai-web to the requested image ref
        run: |
          REF="${{ inputs.image_ref }}"
          case "$REF" in
            # Full artifact URI: use verbatim.
            asia-east1-docker.pkg.dev/*) ;;
            # Bare digest (with or without the sha256: prefix): qualify it.
            *) REF="$IMAGE_BASE@sha256:${REF#sha256:}" ;;
          esac
          echo "Pinning to: $REF"
          gcloud run deploy farm-seges-ai-web \
            --project=seges-ai --region=asia-east1 \
            --image "$IMAGE_BASE@$REF" \
            --allow-unauthenticated \
            --set-secrets "WEB_ACCESS_TOKEN=web-access-token:latest,PLANET_API_KEY=Planet-labs:latest" \
            --set-env-vars "FARM_API_BASE=https://farm-seges-ai-451400509859.asia-east1.run.app,FARM_RECORD_BACKEND=gcs,FARM_RECORD_BUCKET=farm-seges-ai-records,FARM_RECORD_DIR=/tmp/field-notes" \
            --memory 512Mi --cpu 1 --max-instances 2 --timeout 60
          gcloud run services update-traffic farm-seges-ai-web \
            --project=seges-ai --region=asia-east1 --to-latest
      - name: Smoke after pin
        run: |
          BASE="https://farm-seges-ai-web-451400509859.asia-east1.run.app"
          tries=0; livez=""
          until [ "$livez" = "200" ] || [ $tries -ge 12 ]; do sleep 5; tries=$((tries+1)); livez=$(curl -s -o /dev/null -w '%{http_code}' "$BASE/livez"); done
          [ "$livez" = "200" ] || { echo "FAIL livez after pin: $livez"; exit 1; }
          echo "::notice::Pinned service healthy"
