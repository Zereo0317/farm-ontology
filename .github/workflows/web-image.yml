name: web-image

# CI for the FIELD WEB APP image (farm-seges-ai-web). Mirrors the auth shape
# proven in test.yml / deploy-prod-tag.yml (workload-identity federation,
# pool/provider provisioned once per project in deploy/GCP_SETUP.md — no
# repository secrets involved).
#
# Pipeline shape:
#   push to main touching web/** or Dockerfile.web or this file
#     → build image via Cloud Build (web/tools/web-image-build.ps1)
#     → run the web security suite, then deploy that exact digest to production
#       with traffic verification, smoke checks, and rollback.
#   workflow_dispatch WITHOUT image_ref: build and deploy from main.
#   workflow_dispatch WITH image_ref (digest only): PIN job only —
#     rolls the service back to that exact image (explicit digest per
#     ops discipline; see deploy/web-rollback.md).

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "farm_ontology/**"
      - "vocabulary-manifest.json"
      - "Dockerfile.web"
      - ".github/workflows/web-image.yml"
  workflow_dispatch:
    inputs:
      image_ref:
        description: "PIN ONLY: farm web sha256 digest. Leave EMPTY to build and deploy from main."
        required: false
        default: ""

# Serialise everything through one group: two overlapping merges must not
# race two deploys onto the same Cloud Run service.
concurrency:
  group: web-image-production
  cancel-in-progress: false

permissions:
  contents: read

env:
  IMAGE_BASE: asia-east1-docker.pkg.dev/seges-ai/cloud-run-source-deploy/farm-seges-ai-web

jobs:
  build-push:
    # On pushes, or on a manual dispatch that did NOT request a pin.
    if: ${{ inputs.image_ref == '' || inputs.image_ref == null }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    outputs:
      image_tag: ${{ steps.img.outputs.image_tag }}
      image_digest: ${{ steps.img.outputs.image_digest }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install and test web before image build
        working-directory: web
        run: |
          npm ci --ignore-scripts
          node --test tests/*.test.cjs
      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/451400509859/locations/global/workloadIdentityPools/github/providers/github
          service_account: 451400509859-compute@developer.gserviceaccount.com
          project_id: seges-ai
      - uses: google-github-actions/setup-gcloud@v2
      - name: Build and push image via Cloud Build
        run: |
          TAG="ci-$(git rev-parse --short HEAD)"
          pwsh -NoProfile -File web/tools/web-image-build.ps1 -TagSuffix "$TAG"
          echo "image_tag=$TAG" >> "$GITHUB_OUTPUT"
        id: build
        shell: bash
      - name: Resolve the pushed digest (the rollback anchor)
        id: img
        run: |
          set -euo pipefail
          TAG="ci-$(git rev-parse --short HEAD)"
          DIGEST="$(gcloud artifacts docker images describe "$IMAGE_BASE:$TAG" \
            --project seges-ai --format='value(image_summary.digest)')"
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          echo "image_tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "image_digest=$DIGEST" >> "$GITHUB_OUTPUT"
          echo "::notice::Image $IMAGE_BASE@$DIGEST (tag $TAG)"

  deploy-web:
    needs: build-push
    if: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.image_ref == '')) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/451400509859/locations/global/workloadIdentityPools/github/providers/github
          service_account: 451400509859-compute@developer.gserviceaccount.com
          project_id: seges-ai
      - uses: google-github-actions/setup-gcloud@v2
      - name: Deploy tested digest and verify production
        env:
          IMAGE_DIGEST: ${{ needs.build-push.outputs.image_digest }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          IMAGE="$IMAGE_BASE@$IMAGE_DIGEST"
          BASE="https://farm-seges-ai-web-451400509859.asia-east1.run.app"
          gcloud run services describe farm-seges-ai-web --project=seges-ai --region=asia-east1 --format=json > "$RUNNER_TEMP/web-before.json"
          PREVIOUS="$(python -c 'import json,sys; t=json.load(open(sys.argv[1]))["status"]["traffic"]; a=[x for x in t if x.get("percent",0)>0]; assert len(a)==1 and a[0]["percent"]==100; print(a[0]["revisionName"])' "$RUNNER_TEMP/web-before.json")"
          gcloud run deploy farm-seges-ai-web --project=seges-ai --region=asia-east1 --image "$IMAGE" --no-traffic
          CANDIDATE="$(gcloud run services describe farm-seges-ai-web --project=seges-ai --region=asia-east1 --format='value(status.latestReadyRevisionName)')"
          test -n "$CANDIDATE" && test "$CANDIDATE" != "$PREVIOUS"
          ACTUAL_IMAGE="$(gcloud run revisions describe "$CANDIDATE" --project=seges-ai --region=asia-east1 --format='value(status.imageDigest)')"
          test "$ACTUAL_IMAGE" = "$IMAGE"
          rollback() { gcloud run services update-traffic farm-seges-ai-web --project=seges-ai --region=asia-east1 --to-revisions "${PREVIOUS}=100"; }
          trap rollback ERR
          gcloud run services update-traffic farm-seges-ai-web --project=seges-ai --region=asia-east1 --to-revisions "${CANDIDATE}=100"
          gcloud run services describe farm-seges-ai-web --project=seges-ai --region=asia-east1 --format=json > "$RUNNER_TEMP/web-after.json"
          python -c 'import json,sys; t=json.load(open(sys.argv[1]))["status"]["traffic"]; a=[x for x in t if x.get("percent",0)>0]; assert len(a)==1 and a[0]["percent"]==100 and a[0]["revisionName"]==sys.argv[2]' "$RUNNER_TEMP/web-after.json" "$CANDIDATE"
          curl --fail --silent --show-error --retry 5 --retry-delay 3 --max-time 15 "$BASE/livez" > /dev/null
          test "$(curl --silent --show-error --max-time 15 -o /dev/null -w '%{http_code}' "$BASE/")" = 307
          curl --fail --silent --show-error --max-time 20 "$BASE/report/biratori-1119" > /dev/null
          test "$(curl --silent --show-error --max-time 15 -o /dev/null -w '%{http_code}' "$BASE/api/boundaries")" = 401
          trap - ERR
          echo "::notice::Deployed $IMAGE to $CANDIDATE and passed production smoke checks"

  pin-rollback:
    # Dispatch-only: pin the live service to an EXPLICIT older image ref.
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.image_ref != '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/451400509859/locations/global/workloadIdentityPools/github/providers/github
          service_account: 451400509859-compute@developer.gserviceaccount.com
          project_id: seges-ai
      - uses: google-github-actions/setup-gcloud@v2
      - name: Pin farm-seges-ai-web to the requested image ref
        env:
          INPUT_IMAGE_REF: ${{ inputs.image_ref }}
        run: |
          set -euo pipefail
          REF="$(python deploy/web_image_ref.py "$INPUT_IMAGE_REF")"
          echo "Pinning to: $REF"
          # Preserve the existing env and secret set during rollback.
          PREVIOUS="$(gcloud run services describe farm-seges-ai-web --project=seges-ai --region=asia-east1 --format='value(status.traffic[0].revisionName)')"
          test -n "$PREVIOUS"
          gcloud run deploy farm-seges-ai-web \
            --project=seges-ai --region=asia-east1 \
            --image "$REF" --no-traffic
          REV="$(gcloud run services describe farm-seges-ai-web \
            --project=seges-ai --region=asia-east1 \
            --format='value(status.latestReadyRevisionName)')"
          test -n "$REV"
          ACTUAL_IMAGE="$(gcloud run revisions describe "$REV" --project=seges-ai --region=asia-east1 --format='value(status.imageDigest)')"
          test "$ACTUAL_IMAGE" = "$REF"
          rollback() { gcloud run services update-traffic farm-seges-ai-web --project=seges-ai --region=asia-east1 --to-revisions "${PREVIOUS}=100"; }
          trap rollback ERR
          gcloud run services update-traffic farm-seges-ai-web \
            --project=seges-ai --region=asia-east1 --to-revisions "${REV}=100"
          gcloud run services describe farm-seges-ai-web --project=seges-ai --region=asia-east1 --format=json > "$RUNNER_TEMP/web.json"
          python -c 'import json,sys; s=json.load(open(sys.argv[1]))["status"]; t=[r for r in s["traffic"] if r.get("percent",0)>0]; assert len(t)==1 and t[0]["percent"]==100 and t[0]["revisionName"]==sys.argv[2]' "$RUNNER_TEMP/web.json" "$REV"
          BASE="https://farm-seges-ai-web-451400509859.asia-east1.run.app"
          curl --fail --silent --show-error --retry 5 --retry-delay 3 --max-time 15 "$BASE/livez" > /dev/null
          test "$(curl -s -o /dev/null -w '%{http_code}' "$BASE/")" = 307
          curl --fail --silent --show-error --max-time 15 "$BASE/report/biratori-1119" > /dev/null
          trap - ERR
          echo "::notice::Pinned service healthy"
