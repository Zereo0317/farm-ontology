name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unittest:
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14", "3.15"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Byte-compile every module (stdlib-only sanity)
        run: python -m compileall -q farm_ontology tests
      - name: Unit tests
        run: python -m unittest discover -s tests -t . -v
        env:
          GCLOUD_CONFIGURATION: segescloud
          GCP_PROJECT: seges-ai
      - name: Archive infrastructure contract tests
        run: python -m unittest discover -s deploy/infra/archive-project/tests -v

  archive-infra-validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: deploy/infra/archive-project
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.17.2"
      - name: Check Terraform formatting
        run: terraform fmt -check -recursive
      - name: Initialize providers without a backend
        run: terraform init -backend=false
      - name: Validate archive infrastructure
        run: terraform validate

  web-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install web dependencies
        run: npm ci --ignore-scripts
      - name: Test web security and routing
        run: node --test tests/*.test.cjs

  build:
    needs: [unittest, web-test, archive-infra-validate]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Docker build (no push)
        run: docker build -t farm-seges-ai:ci .

  deploy-staging:
    needs: build
    # Only an actual push to main deploys staging; PRs never deploy.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - id: auth
        uses: google-github-actions/auth@v3
        with:
          # Workload identity federation for this repository; the pool and
          # provider are created once per project (see deploy/GCP_SETUP.md).
          workload_identity_provider: projects/451400509859/locations/global/workloadIdentityPools/github/providers/github
          service_account: 451400509859-compute@developer.gserviceaccount.com
          project_id: seges-ai
      - uses: google-github-actions/setup-gcloud@v3
      - name: Deploy staging (source build, immutable revision)
        run: |
          gcloud run deploy farm-seges-ai-staging \
            --project=seges-ai --region=asia-east1 \
            --source . \
            --allow-unauthenticated \
            --update-secrets PLANET_API_KEY=Planet-labs:latest \
            --update-env-vars GCP_PROJECT=seges-ai,EE_PROJECT=seges-ai,FARM_RECORD_BACKEND=gcs,FARM_RECORD_BUCKET=farm-seges-ai-records,FARM_RELEASE_COMMIT=${GITHUB_SHA}
      - name: Pin staging traffic to the latest revision
        run: |
          gcloud run services update-traffic farm-seges-ai-staging \
            --project=seges-ai --region=asia-east1 --to-latest
          gcloud run services describe farm-seges-ai-staging \
            --project=seges-ai --region=asia-east1 --format=json > "$RUNNER_TEMP/staging.json"
          python -c 'import json,sys; s=json.load(open(sys.argv[1]))["status"]; t=[r for r in s["traffic"] if r.get("percent",0)>0]; assert len(t)==1 and t[0]["percent"]==100 and t[0]["revisionName"]==s["latestCreatedRevisionName"]' "$RUNNER_TEMP/staging.json"
          curl --fail --silent --show-error --retry 5 --retry-delay 3 --max-time 15 https://farm-seges-ai-staging-451400509859.asia-east1.run.app/livez > /dev/null

  # Production is NOT touched by this workflow. Deploys to prod go through
  # .github/workflows/deploy-prod-tag.yml, which is workflow_dispatch-only.
  # Production independently verifies CI and staging before promotion.
