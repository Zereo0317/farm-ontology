<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Soybean field record</title>
<style>
  body { margin: 0; font: 22px/1.35 system-ui, sans-serif; background: #f3efe6; color: #1b1914; }
  main { max-width: 76rem; margin: 0 auto; padding: 0.7rem 0.9rem 2rem; }
  h1 { font-size: 2rem; margin: 0; }
  h2 { font-size: 1.2rem; margin: 0 0 0.4rem; }
  #status { margin: 0.35rem 0 0.7rem; font-weight: 750; }
  .deck { display: grid; grid-template-columns: minmax(18rem, 0.9fr) minmax(22rem, 1.15fr); gap: 0.75rem; align-items: start; }
  section { background: #fff; border: 1px solid #d2cbbf; border-radius: 14px; padding: 0.75rem 0.9rem; }
  .docs { max-height: calc(100vh - 8.2rem); overflow: auto; }
  pre { margin: 0 0 0.8rem; white-space: pre-wrap; font: 1rem/1.4 system-ui, sans-serif; }
  label { display: block; margin: 0.4rem 0 0.15rem; font-weight: 700; }
  input, textarea, select, button { font: inherit; width: 100%; box-sizing: border-box; }
  input, textarea, select { padding: 0.5rem 0.6rem; border: 1px solid #7d756b; border-radius: 8px; background: #fff; }
  textarea { min-height: 4.5rem; }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 0.6rem; }
  .checks { display: flex; flex-wrap: wrap; gap: 0.8rem; margin-top: 0.55rem; }
  .checks label { display: flex; align-items: center; gap: 0.4rem; width: auto; margin: 0; }
  .checks input { width: 1.2rem; height: 1.2rem; }
  button { margin-top: 0.7rem; padding: 0.85rem; border-radius: 10px; border: 0; font-weight: 800; }
  button.primary { background: #1f5c32; color: #fff; font-size: 1.25rem; }
  button.secondary { background: #ece7df; color: #1b1914; border: 1px solid #8a8175; }
  .later { margin-top: 0.75rem; display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem; }
  .warn { color: #7a2e12; font-weight: 700; }
  .ok { color: #1d4d2c; font-weight: 700; }
  @media (max-width: 900px) {
    .deck, .later { grid-template-columns: 1fr; }
    .docs { max-height: 16rem; }
  }
</style>
</head>
<body>
<main>
  <h1>Soybean field record</h1>
  <p id="status">Loading status…</p>
  <div class="deck">
    <section class="docs">
      <h2>SOP</h2>
      <pre id="sop">Loading SOP…</pre>
      <h2>Playbook</h2>
      <pre id="playbook">Loading playbook…</pre>
    </section>
    <section>
      <h2>Record this row</h2>
      <form id="obs">
        <div class="row">
          <div><label for="lat">Latitude</label><input id="lat" inputmode="decimal" autocomplete="off"></div>
          <div><label for="lon">Longitude</label><input id="lon" inputmode="decimal" autocomplete="off"></div>
        </div>
        <div class="row">
          <div><label for="sample">Row or sample id</label><input id="sample" autocomplete="off"></div>
          <div><label for="field-note">Note</label><input id="field-note" autocomplete="off"></div>
        </div>
        <div class="row">
          <div><label for="metres">GPS metres, if shown</label><input id="metres" inputmode="decimal" autocomplete="off"></div>
          <div><label for="moisture">Moisture, if metered</label><input id="moisture" inputmode="decimal" autocomplete="off"></div>
        </div>
        <div class="row">
          <div><label for="photo">Photo path</label><input id="photo" autocomplete="off"></div>
          <div><label for="unit">Harvest unit</label><input id="unit" autocomplete="off"></div>
        </div>
        <div class="checks">
          <label><input type="checkbox" id="weather"> Attach weather grid</label>
          <label><input type="checkbox" id="dry"> Dry run, not the farm</label>
        </div>
        <button class="primary" type="submit">Save observation</button>
        <p id="obs-msg"></p>
      </form>
    </section>
  </div>
  <div class="later">
    <section>
      <h2>Recorded notes</h2>
      <div id="notes">None yet.</div>
      <button class="secondary" id="refresh" type="button">Refresh list</button>
    </section>
    <section>
      <h2>Verify or feedback</h2>
      <form id="feedback-form">
        <label for="kind">Kind</label>
        <select id="kind">
          <option value="verification">Verification</option>
          <option value="feedback">Feedback</option>
        </select>
        <label for="file">Observation file, optional</label>
        <input id="file" placeholder="obs-….json" autocomplete="off">
        <label for="text">Note</label>
        <textarea id="text" required></textarea>
        <button class="secondary" type="submit">Save note</button>
        <p id="note-msg"></p>
      </form>
    </section>
  </div>
</main>
<script>
async function getJSON(url) {
  const response = await fetch(url);
  if (!response.ok) throw new Error(await response.text());
  return response.json();
}
function show(id, value) {
  document.getElementById(id).textContent = typeof value === "string" ? value : JSON.stringify(value, null, 2);
}
async function loadStatus() {
  const body = await getJSON("/api/status");
  const financial = body.permits_financial_use ? "financial use true" : "financial use false";
  document.getElementById("status").textContent =
    "Soybean " + body.crop_ontology_id + ". Class C " + body.class_c_policy + ". " +
    financial + ". Grid " + body.native_resolution_deg + "°, not shrunk. " +
    body.observation_count + " observations, " + body.note_count + " notes.";
}
async function loadDocs() {
  show("playbook", await getJSON("/api/playbook").then((b) => b.playbook));
  show("sop", await getJSON("/api/sop").then((b) => b.sop));
}
function line(item) {
  const li = document.createElement("li");
  li.textContent = item.file + (item.kind ? " · " + item.kind : " · " + (item.sample_id || "no sample")) + (item.text ? " · " + item.text : "");
  return li;
}
async function loadNotes() {
  const body = await getJSON("/api/notes");
  const box = document.getElementById("notes");
  box.replaceChildren();
  if (!body.observations.length && !body.notes.length) {
    box.textContent = "None yet.";
    return;
  }
  const obs = document.createElement("ul");
  body.observations.forEach((item) => obs.append(line(item)));
  const notes = document.createElement("ul");
  body.notes.forEach((item) => notes.append(line(item)));
  box.append("Observations", obs, "Notes", notes);
}
function numberOrNull(value) {
  if (value === "") return null;
  const parsed = Number(value);
  if (Number.isNaN(parsed)) throw new Error("a number field is not a number");
  return parsed;
}
document.getElementById("obs").addEventListener("submit", async (event) => {
  event.preventDefault();
  const msg = document.getElementById("obs-msg");
  msg.textContent = "Saving…";
  try {
    const dry = document.getElementById("dry").checked;
    const payload = {
      latitude: dry ? 0 : numberOrNull(document.getElementById("lat").value),
      longitude: dry ? 0 : numberOrNull(document.getElementById("lon").value),
      note: document.getElementById("field-note").value,
      sample_id: document.getElementById("sample").value,
      photo: document.getElementById("photo").value,
      harvest_unit: document.getElementById("unit").value,
      metres: numberOrNull(document.getElementById("metres").value),
      moisture: numberOrNull(document.getElementById("moisture").value),
      attach_weather: document.getElementById("weather").checked,
      dry_run: dry
    };
    const response = await fetch("/api/observations", {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(payload)});
    const body = await response.json();
    if (!response.ok) throw new Error(body.error || "save failed");
    msg.className = "ok";
    msg.textContent = "Saved " + body.file + (body.observation.weather.attach_error ? ". Weather was not attached: " + body.observation.weather.attach_error : "");
    document.getElementById("file").value = body.file;
    await loadNotes();
    await loadStatus();
  } catch (error) {
    msg.className = "warn";
    msg.textContent = String(error.message || error);
  }
});
document.getElementById("feedback-form").addEventListener("submit", async (event) => {
  event.preventDefault();
  const msg = document.getElementById("note-msg");
  try {
    const payload = {
      kind: document.getElementById("kind").value,
      text: document.getElementById("text").value,
      observation_file: document.getElementById("file").value
    };
    const response = await fetch("/api/notes", {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(payload)});
    const body = await response.json();
    if (!response.ok) throw new Error(body.error || "save failed");
    msg.className = "ok";
    msg.textContent = "Saved " + body.file;
    document.getElementById("text").value = "";
    await loadNotes();
    await loadStatus();
  } catch (error) {
    msg.className = "warn";
    msg.textContent = String(error.message || error);
  }
});
document.getElementById("refresh").addEventListener("click", () => loadNotes().catch((error) => {
  document.getElementById("notes").textContent = String(error.message || error);
}));
Promise.all([loadStatus(), loadDocs(), loadNotes()]).catch((error) => {
  document.getElementById("status").textContent = String(error.message || error);
});
</script>
</body>
</html>
