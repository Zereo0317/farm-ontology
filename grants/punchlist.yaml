    owner: lead + founder (human decision at 2026-11-30 checkpoint)
    evidence_to_attach: >-
      Quote PDF / mail thread; executed MSA or order-form URL; countersigned
      contract; invoice; the executed grant JSON (specimen: false) replacing
      grants/planet-trial.json with the same feed list.
    expected_unlock: >-
      planet.psscene and planet.planetary-variable.soil-water-content gain
      permits_financial_use=true for the granted uses; 10 m-scale imagery
      enters the commercial spine (roadmap P3) instead of dying with the
