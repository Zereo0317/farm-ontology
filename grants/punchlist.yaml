      key in Secret Manager 'Planet-labs' v3): 3,000 monitoring credits,
      1 OAuth client seat, Sandbox Data + Open Data + BYOD, Catalog /
      Statistical / Process / OGC APIs. Trial terminates 2026-12-17. Decision
      checkpoint 2026-11-30: purchase or accept downgrade to header-only Open
      Data + Sentinel-2 path.
    next_action: >-
      BEFORE 2026-11-30: request a written quote for a commercial monitoring
      plan that converts (1) the QUOTE PATH - sales contact through the
      pricing page; (2) SEATS - at least two (ops + continuity) against the
      single trial seat; (3) the CREDIT MODEL - replace 3,000 trial credits
      with real monthly consumption maths sized to the nightly psscene
