    sources:
      - url: https://www.jma.go.jp/
        note: JMA site root - the usage/copyright notice is linked in the page footer; enter there and snapshot the current terms (site paths move)
        verified: "2026-11-17"
      - url: https://laws.e-gov.go.jp/search?keyword=%E6%B0%97%E8%B1%A1%E6%A5%AD%E5%8B%99%E6%B3%95
        note: e-Gov statute search for 気象業務法 (Meteorological Services Act) - check registration/certification duties before commercial weather publication
        verified: "2026-11-17"

  - id: PL-ACTUATION-COMPLIANCE
    title: Actuation-era compliance stubs (航空法 drone spraying, 農薬適用基準, ISO11783 data ownership)
    area: actuation (WS5 prerequisites)
    status: NOT-YET-EXECUTED
    current_status: >-
      No machine/drone/valve interface exists yet (roadmap ground truth).
      Three requirement families must be verified BEFORE any live actuation
      packet is produced: (1) 航空法 - drone registration (mandatory since
      2022-06-20 for >=100 g airframes), Remote ID, flight
      permission/approval via DIPS2.0, and for beyond-visual-line-of-sight
      spraying the レベル4 (level 4) certified-airframe / certified-pilot
      framework; spraying flights add duties on top of generic flight
      permissions. (2) 農薬適用基準 - a spray prescription may only cite
      registered crop x agent combinations per the FAMIC/ACIS 農薬登録情報
      (application criteria); aerial (drone) application sits under
      prefectural and MAFF guidance layered on the registered uses.
      (3) ISO11783 - the TaskData standard governs interchange format, NOT
      data ownership; before the command ledger dispatches anything derived
      from machine telemetry, the machine vendor's data-rights terms must
      be read and a data-sharing agreement signed.
    next_action: >-
      Keep these as DESIGN STUBS with the refusal rules proposed here:
      command-ledger 'propose' must refuse a drone packet lacking permit
      numbers; recommendation engine refuses spray rows not matching
      registered uses; command ledger refuses telemetry-derived prescriptions
      absent a signed data-sharing agreement. Humans verify each family and
      record findings/evidence here; no live actuation before the Phase-4
      gate regardless.
    owner: lead (specs) + actuation agent (stubs) + founder (registrations/signature)
    evidence_to_attach: >-
      Airframe registration numbers; pilot certificates; flight-permission
      approvals (DIPS2.0 receipts); registered-use extracts per agent/crop
      (FAMIC); machine-vendor data-rights excerpts + signed data-sharing
      agreement (ISO11783 host-equipment context).
    expected_unlock: >-
      WS5 deliverables become LEGAL to execute against real machines in the
      Phase-4 window; none of the three families can be satisfied by a
      grant alone - they are separate certificates/evidence attached to the
      command ledger records.
    verification_stub_note: >-
      Packet-production code that will read these stubs does not exist yet
      (actuation package is WS5's scope); the stub definitions live here so
      WS5 inherits closed doors, not open guesses.
    sources:
      - url: https://www.mlit.go.jp/koku/drone/
        note: MLIT unmanned-aircraft registration portal (registration mandatory >=100 g since 2022-06-20; DIPS2.0 link); fetched HTTP 200
        verified: "2026-11-17"
      - url: https://www.mlit.go.jp/koku/level4/
        note: MLIT level-4 flight portal (certified airframe / certified pilot for BVLOS); linked live from the registration portal
        verified: "2026-11-17"
      - url: https://www.mlit.go.jp/koku/permitapproval/
        note: MLIT flight permission/approval application portal; linked live from the registration portal
        verified: "2026-11-17"
      - url: https://www.acis.famic.go.jp/
        note: FAMIC pesticide hub (農薬登録情報ダウンロード holds registered uses / application criteria incl. aerial guidance); fetched HTTP 200
        verified: "2026-11-17"
      - url: https://committee.iso.org/home/tc23
        note: ISO/TC 23 (agricultural machinery, custodian of the ISO 11783 series) - locate the current TaskData part there; VERIFY the data-ownership posture with machine vendors, the standard itself buys no rights
        verified: "2026-11-17"

