  - id: PL-JMA-REDISTRIBUTION
    title: JMA redistribution - official data usage terms for commercial products; 二次提供 agreement if any
    area: official weather warnings / hazard feeds
    status: NOT-YET-EXECUTED
    current_status: >-
      Torrential-rain, snow, marine warnings and the two-week/seasonal
      headers are recorded from JMA publication. Whether COMMERCIAL
      redistribution of these (or derivatives) requires JMA-site usage-term
      compliance beyond copyright attribution, or constitutes 二次提供
      (secondary provision) needing a separate arrangement, is UNVERIFIED.
      We never claim to be the legal meteorological authority; that adapter
      refusal is permanent.
    next_action: >-
      Verify the current JMA site usage / copyright notice for commercial
      redistribution; search the Meteorological Services Act (気象業務法)
      and related guidance for whether our product pattern counts as
      二次提供 requiring registration/notification/agreement; record the
      finding here (still without legal conclusions); if an agreement or
      notice is required, prepare it for founder signature, then attach an
      executed jma.hazard grant (specimen-less, none shipped yet).
    owner: founder (external enquiry) + licences agent (evidence pack)
    evidence_to_attach: >-
      JMA terms snapshot + URL + fetch date; statute/guidance excerpts with
      URLs; mail thread with JMA or 気象業務支援機関 if engaged; executed
      grant when applicable.
    expected_unlock: >-
      jma.hazard gains a permit only to the extent the terms verifiably
      allow, e.g. redistribution of recorded warnings inside commercial
