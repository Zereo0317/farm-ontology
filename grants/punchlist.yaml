# Commercial punch-list as data (WS6 deliverable 6.3, task-6).
#
# RULES OF THIS FILE:
# - No legal conclusions. Every item states requirements TO VERIFY with
#   sources. Verification date: 2026-11-17 (dates in each source row).
# - Every item carries status: NOT-YET-EXECUTED until the evidence named in
#   `evidence_to_attach` exists in the repo or a referenced drive.
# - Executing an item means replacing the matching SPECIMEN grant under
#   grants/ with an executed certificate (specimen: false) - the specimen
#   itself unlocks nothing (evaluation reason: 'specimen').
# - The contract pack below is READY-TO-SIGN TEXT awaiting the corporate
#   status item (PL-CORPORATE-STATUS); a not-yet-incorporated entity must
#   not be named as principal on any signed copy.

meta:
  title: Commercial unlock punch-list (Planet / Earth Engine / Open-Meteo / JMA / actuation / corporate)
  written: "2026-11-17"
  verification_date: "2026-11-17"
  status_default: NOT-YET-EXECUTED
  owner_convention: >-
    Humans (founder, lead) own every externally signed artefact; agents
    prepare evidence drafts only.
  fail_closed_reminder: >-
    Until an item is executed, its feed evaluates to a refusal ('specimen',
    'no_grant', 'expired') and permits_financial_use stays false.

contract_pack:
  status: READY-TO-SIGN (awaiting PL-CORPORATE-STATUS)
  applicable_when: >-
    Any contract sold to a farmer (decision-support or revenue-share), per
    docs/alpha-fairness-doctrine.md section 4 rail 1.
  clause_4_1_concurrent_position_disclosure:
    label: Concurrent-position disclosure (doctrine §4.1, verbatim, mandatory)
    text: >-
      "The Company maintains proprietary positions in agricultural
      commodities. When its data indicates materially adverse or favourable
      conditions for Your fields, the Company shall disclose the existence
      — never the size — of related positions in its periodic
      decision-support report, before the affected transaction dates."
    placement: every farmer-facing contract body, before the signatures block
    tested_by: tests/test_licences_punchlist.py
  signatory_block:
    Company_principal: PENDING-PL-CORPORATE-STATUS
    Counterparty: per-contract
    Witness: per-contract
  drafter_note: >-
    The §4.1 sentence is bound verbatim; edits require a Lead-approved
    doctrine commit referencing a dated rationale (doctrine §8).

items:

